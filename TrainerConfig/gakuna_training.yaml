behaviors:
  Evacuationer:
    summary_freq: 500
    trainer_type: ppo

    hyperparameters:
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      batch_size: 1024
      buffer_size: 10240
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0

    time_horizon: 55
    max_steps: 5000000
    keep_checkpoints: 5
    checkpoint_interval: 500000

env_settings:
  num_envs: 1
  timeout_wait: 60

engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
